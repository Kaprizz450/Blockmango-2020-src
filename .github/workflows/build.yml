name: Build Windows Engine

on: [workflow_dispatch, push]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check build scripts
        shell: cmd
        run: |
          cd engine-10068\dev
          type cmakeall.cmd

      - name: Run CMake Build
        shell: cmd
        run: |
          cd engine-10068\dev
          call cmakeall.cmd

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: BlockmanGO-PC-Build
          path: |
            engine-10068/**/*.exe
            engine-10068/**/*.dll
