name: Check Libs and Core SLN

on: [workflow_dispatch, push]

jobs:
  check-libs:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find all .lib files in repo
        shell: pwsh
        run: |
          Write-Host "=== Все .lib файлы в репозитории ==="
          Get-ChildItem -Path "engine-10068" -Filter "*.lib" -Recurse | Select-Object FullName
          Write-Host "`n=== Папки внутри Dependencies ==="
          Get-ChildItem -Path "engine-10068\engine-core\dev\engine\Dependencies" -Recurse -Depth 2 | Select-Object FullName
