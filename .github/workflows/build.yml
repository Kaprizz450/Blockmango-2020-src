name: Build BlockmanGO Full PC

on: [workflow_dispatch, push]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild & MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-x86-bmgo-v1

      - name: Install Missing Libs via vcpkg & Compile Lua
        shell: pwsh
        run: |
          vcpkg install freetype:x86-windows freeimage:x86-windows zlib:x86-windows g3log:x86-windows

          $vcpkgLib = "C:\vcpkg\installed\x86-windows\lib"
          $depBase = "engine-10068\engine-core\dev\engine\Dependencies"

          New-Item -ItemType Directory -Force -Path "$depBase\FreeType\Win32\Lib" | Out-Null
          New-Item -ItemType Directory -Force -Path "$depBase\FreeImage\Win32\Lib" | Out-Null
          New-Item -ItemType Directory -Force -Path "$depBase\Zlib\Win32\Lib" | Out-Null
          New-Item -ItemType Directory -Force -Path "$depBase\g3log\win32\lib" | Out-Null
          New-Item -ItemType Directory -Force -Path "$depBase\Lua\Win32\Lib" | Out-Null

          Copy-Item "$vcpkgLib\freetype*.lib" "$depBase\FreeType\Win32\Lib\FreeType.lib"
          Copy-Item "$vcpkgLib\FreeImage*.lib" "$depBase\FreeImage\Win32\Lib\FreeImage.lib"
          Copy-Item "$vcpkgLib\zlib*.lib" "$depBase\Zlib\Win32\Lib\zlib.lib"
          Copy-Item "$vcpkgLib\g3log*.lib" "$depBase\g3log\win32\lib\g3logger.lib"

          # Дублируем libcurl_imp.lib в libcurl.lib на случай если клиент запросит оба имени
          if (Test-Path "engine-10068\dev\logic\dependencies\curl\win32\lib\libcurl_imp.lib") {
            Copy-Item "engine-10068\dev\logic\dependencies\curl\win32\lib\libcurl_imp.lib" "engine-10068\dev\logic\dependencies\curl\win32\lib\libcurl.lib" -Force
          }

          # Собираем lua.lib из исходников внутри репозитория
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          cmd /c "`"$vsPath\VC\Auxiliary\Build\vcvars32.bat`" && cl /c /O2 /MD /D_CRT_SECURE_NO_WARNINGS $depBase\Lua\Src\*.c /Fo$depBase\Lua\Win32\Lib\ && del /q $depBase\Lua\Win32\Lib\lua.obj $depBase\Lua\Win32\Lib\luac.obj 2>nul && lib /OUT:$depBase\Lua\Win32\Lib\lua.lib $depBase\Lua\Win32\Lib\*.obj"

      - name: Generate CMake Projects
        shell: pwsh
        run: |
          $env:CMAKE_POLICY_VERSION_MINIMUM = "3.5"
          $dirs = @(
            "engine-10068\engine-core\dev\engine",
            "engine-10068\engine-core\dev\clothes",
            "engine-10068\dev\logic",
            "engine-10068\dev\server",
            "engine-10068\dev\client"
          )
          foreach ($dir in $dirs) {
            if (Test-Path "$dir\CMakeLists.txt") {
              Write-Host "=== CMake: $dir ==="
              New-Item -ItemType Directory -Force -Path "$dir\Build" | Out-Null
              Push-Location "$dir\Build"
              cmake -A Win32 ..
              Pop-Location
            }
          }

      - name: Build Engine Core & Clothes
        shell: pwsh
        run: |
          cmake --build "engine-10068\engine-core\dev\engine\Build" --config Release --parallel
          cmake --build "engine-10068\engine-core\dev\clothes\Build" --config Release --parallel

          $binRelease = "engine-10068\engine-core\dev\engine\Bin\release"
          New-Item -ItemType Directory -Force -Path $binRelease | Out-Null
          Get-ChildItem "engine-10068\engine-core\dev\engine" -Filter "*.lib" -Recurse | Copy-Item -Destination $binRelease -Force

      - name: Build Server (WinServer.sln)
        shell: cmd
        run: |
          msbuild engine-10068\dev\server\WinServer.sln /p:Configuration=Release /p:Platform=Win32 /m

      - name: Build Client (WinShell.sln)
        shell: cmd
        run: |
          msbuild engine-10068\dev\client\Shells\Win32\WinShell.sln /p:Configuration=Release /p:Platform=Win32 /m

      - name: List built EXE & DLL files
        shell: cmd
        run: |
          dir /s /b engine-10068\*.exe

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: BlockmanGO-PC-Full
          path: |
            engine-10068/**/*.exe
            engine-10068/**/*.dll
            C:/vcpkg/installed/x86-windows/bin/*.dll
