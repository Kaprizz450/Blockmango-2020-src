name: Check Required Libs

on: [workflow_dispatch, push]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect CMakeLists & SDK
        shell: pwsh
        run: |
          Write-Host "=== Core CMakeLists.txt ==="
          Get-Content "engine-10068\engine-core\dev\engine\Src\Core\CMakeLists.txt"
          Write-Host "`n=== Server CMakeLists.txt ==="
          Get-Content "engine-10068\dev\server\src\CMakeLists.txt"
          Write-Host "`n=== Client CMakeLists.txt ==="
          Get-Content "engine-10068\dev\client\Src\CMakeLists.txt"
