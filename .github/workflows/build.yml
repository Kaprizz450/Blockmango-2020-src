name: Build BlockmanGO PC Client & Server

on: [workflow_dispatch, push]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Generate CMake Projects (Core & Dev)
        shell: pwsh
        run: |
          $dirs = @(
            "engine-10068\engine-core\dev\engine",
            "engine-10068\engine-core\dev\clothes",
            "engine-10068\dev\logic",
            "engine-10068\dev\server",
            "engine-10068\dev\client"
          )
          foreach ($dir in $dirs) {
            if (Test-Path "$dir\CMakeLists.txt") {
              Write-Host "=== CMake: $dir ==="
              New-Item -ItemType Directory -Force -Path "$dir\Build" | Out-Null
              Push-Location "$dir\Build"
              cmake -A Win32 -DCMAKE_POLICY_VERSION_MINIMUM=3.5 ..
              Pop-Location
            }
          }

      - name: Build Server (WinServer.sln)
        shell: cmd
        run: |
          msbuild engine-10068\dev\server\WinServer.sln /p:Configuration=Release /p:Platform=Win32 /m

      - name: Build Client (WinShell.sln)
        shell: cmd
        run: |
          msbuild engine-10068\dev\client\Shells\Win32\WinShell.sln /p:Configuration=Release /p:Platform=Win32 /m

      - name: List built EXE files
        shell: cmd
        run: |
          dir /s /b engine-10068\*.exe

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: BlockmanGO-PC-Client-Server
          path: |
            engine-10068/**/*.exe
            engine-10068/**/*.dll
