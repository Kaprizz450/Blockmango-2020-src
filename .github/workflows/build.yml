name: Inspect Build Scripts

on: [workflow_dispatch, push]

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read build scripts and find CMakeLists
        shell: pwsh
        run: |
          Write-Host "=== cmakeall.cmd ==="
          Get-Content "engine-10068\dev\cmakeall.cmd" -ErrorAction SilentlyContinue
          Write-Host "`n=== Rebuild.bat ==="
          Get-Content "engine-10068\dev\Rebuild.bat" -ErrorAction SilentlyContinue
          Write-Host "`n=== Все файлы CMakeLists.txt ==="
          Get-ChildItem -Path "engine-10068" -Filter "CMakeLists.txt" -Recurse | Select-Object FullName
          Write-Host "`n=== Все файлы .sln ==="
          Get-ChildItem -Path "engine-10068" -Filter "*.sln" -Recurse | Select-Object FullName
